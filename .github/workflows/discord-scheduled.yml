# 定時發到 Discord（tools/content/announce.cjs）：今日館訊（每天排程 08:23 開始寫、約 08:55 部署完；部署成功後馬上叫這支，定時 09:17／09:37 是備援）、限時活動開跑、content/公告排程.json 的預約公告。
# 只在該發的時間跑：repo 是私有的，一直檢查會用光免費的 Actions 額度（理由見 tools/content/announce.cjs）。
# 發過的記在 Actions cache，到點和補的那次不會重發。
name: Discord 預約公告

on:
  # >>> 定時（tools/content/announce.cjs --sync 產生的，不要手改）
  schedule:
    - cron: "17 1 * * *" # 今日館訊：台灣每天 09:17（備援：排程 08:23 開始、約 08:55 部署完，備援排在部署之後）
    - cron: "37 1 * * *" # 今日館訊：補一次
    - cron: "53 11 * * *" # 限時活動 20:00：台灣每天 19:53
    - cron: "13 12 * * *" # 限時活動 20:00：補一次
    - cron: "53 5 * * 0,6" # 限時活動 14:00：台灣週末 13:53
    - cron: "13 6 * * 0,6" # 限時活動 14:00：補一次
    - cron: "25 0 11 11 *" # 大廳總覽和館友證：台灣 2026-11-11 08:25
    - cron: "45 0 11 11 *" # 大廳總覽和館友證：補一次
    - cron: "35 0 16 11 *" # 音效大更新：台灣 2026-11-16 08:35
    - cron: "55 0 16 11 *" # 音效大更新：補一次
    - cron: "0 7 21 11 *" # 每日任務換新：台灣 2026-11-21 15:00
    - cron: "20 7 21 11 *" # 每日任務換新：補一次
  # <<< 定時
  workflow_dispatch:

# 一次只跑一個，免得同一則發兩次
concurrency:
  group: discord-scheduled
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # 看最新一次部署成功了沒

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 讀哪些發過了
        uses: actions/cache/restore@v4
        with:
          path: .announce-state
          key: announce-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: announce-state-
      - name: 看最新一次部署
        id: deploy
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        # 最新壹次部署不是現在 main 的那個 commit（還沒開始跑）就寫 stale/：定時備援會等部署完才發今日館訊（tools/content/announce.cjs 的 deployNotReady）
        run: echo "state=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow=deploy.yml --branch main --limit 1 --json status,conclusion,headSha --jq '.[0] | if .headSha == env.GITHUB_SHA then ([.status, .conclusion] | join("/")) else "stale/" end')" >> "$GITHUB_OUTPUT"
      - name: 發到時間的公告
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DEPLOY_STATE: ${{ steps.deploy.outputs.state }}
        run: node tools/content/announce.cjs
      - name: 記下哪些發過了
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .announce-state
          key: announce-state-${{ github.run_id }}-${{ github.run_attempt }}
