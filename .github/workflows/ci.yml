# 每個 PR 都跑：測試 → 打包 → 維護日誌檢查。沒過就不要合併（AI 合併前要看這個是綠的，決定 0024）。
# 免費帳號的私人 repo 鎖不住 main；部署在 deploy.yml，合併到 main 後先重跑測試，過了才部署。
name: CI

# 合併到 main 不再跑：deploy.yml 合併後本來就會先跑同一套測試，兩邊都跑等於測兩次（翊文 11-13 同意，Actions 分鐘用到 90%）
on:
  pull_request:

permissions:
  contents: read

# 同一個 PR 又推了新的：舊的那次直接取消，不用跑完（11-20：省 Actions 分鐘，ship 修 CI 常常連推好幾次）
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # 維護日誌檢查要比對 PR 改了哪些檔
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # node_modules 整包快取（跟 deploy.yml 同一把 key）：套件沒變就不用 npm ci，每次省 15～20 秒（11-20）
      - id: nm
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            functions/node_modules
          key: nm-${{ runner.os }}-n22-${{ hashFiles('package-lock.json', 'functions/package-lock.json') }}
      - name: 裝套件（快取沒有才裝）
        if: steps.nm.outputs.cache-hit != 'true'
        run: |
          npm ci
          npm --prefix functions ci
      # 記下這次測的是哪個 tree（pull_request 測的是 GitHub 暫時合出來的 merge ref）。合併後 deploy.yml 看這個名字：
      # 合併出來的 tree 跟這裡測過的完全一樣，就不重跑一樣的測試（tools/release/deploy_gate.cjs）。這步一定要在測試之前，名字格式不能改。
      - id: tree
        run: echo "hash=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - name: 測試的 tree ${{ steps.tree.outputs.hash }}
        run: echo "測的 tree：${{ steps.tree.outputs.hash }}"
      # 一律跑全套：經濟自我檢查改成規則只跑一次之後不慢了，不再有「只改內容就跳過」（那會讓部署分不出哪些 CI 是全套跑過的）
      - name: 測試（規則、內容、特效、模組、日誌格式）
        run: npm test
      - name: 打包
        run: npm run build
      - name: PR 改了程式就要有維護日誌
        if: github.event_name == 'pull_request'
        run: node tools/check/log_check.cjs --base origin/${{ github.base_ref }}
